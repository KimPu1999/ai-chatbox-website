name: PyChat quality gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pychat
          POSTGRES_PASSWORD: pychat
          POSTGRES_DB: pychat_phase9_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pychat -d pychat_phase9_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://pychat:pychat@127.0.0.1:5432/pychat_phase9_test
      - run: ruff check app tests
      - run: pytest -v --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pychat:pychat@127.0.0.1:5432/pychat_phase9_test
          REDIS_URL: redis://127.0.0.1:6379/9
      - run: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://pychat:pychat@127.0.0.1:5432/pychat_phase9_test

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r backend/requirements.txt
      - run: bandit -r backend/app -ll
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: |
          if git grep -n -I -E 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- . ':!frontend/package-lock.json'; then
            echo "Potential credential material found"
            exit 1
          fi

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pychat
          POSTGRES_PASSWORD: pychat
          POSTGRES_DB: pychat_phase9_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pychat -d pychat_phase9_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pychat:pychat@127.0.0.1:5432/pychat_phase9_test
      - run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pychat-api.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pychat:pychat@127.0.0.1:5432/pychat_phase9_test
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_SKIP_WEB_SERVER: 'false'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  quality-gate:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test, security-scan, playwright-e2e]
    steps:
      - run: echo "All required PyChat checks passed"
